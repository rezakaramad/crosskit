apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xtenantsso
spec:
  compositeTypeRef:
    apiVersion: idp.rezakara.demo/v1beta1
    kind: XTenantSSO
  mode: Pipeline
  pipeline:
    - step: run-the-template
      functionRef:
        name: xtenantsso
      input:
        apiVersion: defaults.fn.crossplane.io/v1beta1
        kind: Input

        # A Group, an AppRole and a RoleAssignment are created for each app.
        apps:
          - name: argocd
            displayName: ArgoCD
            appRegObjectID: 00000000-0000-0000-0000-000000000000 # The ObjectID of the App Registration
            enterpriseAppObjectID: 00000000-0000-0000-0000-000000000000 # The ObjectID of the Enterprise App
          - name: vault
            displayName: Vault
            appRegObjectID: 00000000-0000-0000-0000-000000000000
            enterpriseAppObjectID: 00000000-0000-0000-0000-000000000000

        # The provider config all resources should reference.
        providerConfigRef:
          name: azuread
          kind: ClusterProviderConfig
